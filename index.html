<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orca的聊天室</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
  background:#fff; color:#333;
  display:flex; flex-direction:column;
  font-size:15px;
}

/* ===== 登录页 ===== */
#login {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:24px;
}
#login h1 {
  font-size:20px; font-weight:600; color:#4a90e2;
  letter-spacing:3px; margin-bottom:44px;
}
#nameInput {
  width:100%; max-width:280px;
  border:none; border-bottom:1px solid #d8e2ec;
  padding:10px 4px; font-size:16px;
  outline:none; text-align:center;
  transition:border-color .2s;
  background:transparent;
}
#nameInput:focus { border-bottom-color:#4a90e2; }
#loginBtn {
  margin-top:30px;
  width:100%; max-width:280px;
  background:#4a90e2; color:#fff;
  border:none; border-radius:4px;
  padding:11px; font-size:15px; letter-spacing:2px;
  cursor:pointer;
}
#loginBtn:active { background:#3a7bc8; }

/* ===== 聊天主界面 ===== */
#app { flex:1; display:none; flex-direction:column; min-height:0; }
header {
  padding:12px 16px;
  border-bottom:1px solid #eef2f6;
  text-align:center;
  font-size:13px; color:#4a90e2; letter-spacing:4px;
  position:relative;
}
#balance {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  font-size:12px; color:#999; white-space:nowrap;
  background:#f5f7fa; padding:2px 8px; border-radius:10px;
}
#msgs {
  flex:1; overflow-y:auto;
  padding:14px 16px;
  -webkit-overflow-scrolling:touch;
}
.time { font-size:11px; color:#c2ccd6; margin:10px 0 4px; }
.line { margin:3px 0; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
.line .nm { color:#333; cursor:pointer; display:inline-block; }
.line .tx { color:#444; }
.line.mine .nm, .line.mine .tx { color:#5b9bd9; }

/* 系统提示 */
.sys {
  text-align:center;
  font-size:11px; color:#bcc8d4;
  margin:8px 0;
}

/* 上屏动画：上浮渐出 */
@keyframes riseIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
.time.new, .line.new, .sys.new { animation:riseIn .28s ease-out both; }

/* 被拍一震 */
@keyframes shakeX {
  0%,100% { transform:translateX(0); }
  20% { transform:translateX(-7px); }
  40% { transform:translateX(6px); }
  60% { transform:translateX(-4px); }
  80% { transform:translateX(3px); }
}
#app.shaking { animation:shakeX .4s ease-in-out; }

/* 颜文字栏（点击表情按钮展开） */
#emoWrap {
  overflow:hidden;
  max-height:0;
  transition:max-height .22s ease;
}
#emoWrap.open { max-height:60px; border-top:1px solid #eef2f6; }
#emo {
  display:flex; gap:6px;
  overflow-x:auto;
  padding:8px 12px;
  scrollbar-width:none;
}
#emo::-webkit-scrollbar { display:none; }
#emo button {
  flex:0 0 auto;
  border:1px solid #e3ecf5; border-radius:3px;
  background:#fafcff; color:#6b93bf;
  font-size:13px; line-height:1;
  padding:6px 10px; cursor:pointer;
}
#emo button:active { background:#eaf3fc; }

/* 输入区 */
#inputBar {
  display:flex; gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #eef2f6;
  align-items:center;
}
#emoBtn {
  flex:0 0 auto;
  width:38px; height:38px;
  border:none; border-radius:4px;
  background:transparent;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
#emoBtn:active { background:#eef5fc; }
#sendBtn {
  flex:0 0 auto;
  width:38px; height:38px;
  border:none; border-radius:4px;
  background:#f5f7fa;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
#sendBtn:active { background:#eef5fc; }
#txt {
  flex:1; min-width:0;
  border:1px solid #dde6ef; border-radius:4px;
  padding:9px 12px; font-size:15px;
  outline:none; background:#fff;
}
#txt:focus { border-color:#4a90e2; }
#send {
  flex:0 0 auto;
  border:none; border-radius:4px;
  background:#4a90e2; color:#fff;
  padding:0 16px; height:38px; font-size:14px;
  cursor:pointer;
}
#send:active { background:#3a7bc8; }
</style>
</head>
<body>

<div id="login">
  <h1>Orca的聊天室</h1>
  <input id="nameInput" maxlength="20" placeholder="你的名字">
  <button id="loginBtn">进 入</button>
</div>

<div id="app">
  <header>
    Orca的聊天室
    <span id="balance"></span>
  </header>
  <div id="msgs"></div>
  <div id="emoWrap">
    <div id="emo"></div>
  </div>
  <div id="inputBar">
    <button id="emoBtn" title="颜文字">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b93bf" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <line x1="9" y1="10" x2="9" y2="10.01" stroke-width="2.2"/>
        <line x1="15" y1="10" x2="15" y2="10.01" stroke-width="2.2"/>
        <path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/>
      </svg>
    </button>
    <button id="sendBtn" title="转账" style="font-size:16px;color:#6b93bf;font-weight:bold;">$</button>
    <input id="txt" maxlength="500" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const EMOS = ['XD', ':D', ':)', ':(', ';)', '>_<', '^_^', 'T_T', 'QAQ', 'orz', '=_='];

let ws = null;
let joined = false;
let myName = '';
let lastHm = '';
let stick = true;
let sid = localStorage.getItem('lc_sid') || (Date.now().toString(36) + Math.random().toString(36).slice(2));
localStorage.setItem('lc_sid', sid);
let reconnectTimer = null;
const seen = new Set();
let myBalance = 0;

function seenMsg(id) {
  if (!id || seen.has(id)) return true;
  seen.add(id);
  if (seen.size > 2000) seen.clear();
  return false;
}

function fmtBalance(c_kb) {
  const kb = c_kb / 100;
  if (kb >= 1024 * 1024 * 1024) return (kb / (1024 * 1024 * 1024)).toFixed(2) + ' TB';
  if (kb >= 1024 * 1024) return (kb / (1024 * 1024)).toFixed(2) + ' GB';
  if (kb >= 1024) return (kb / 1024).toFixed(2) + ' MB';
  return kb.toFixed(2) + ' KB';
}

function updateBalance(bal) {
  myBalance = bal;
  $('balance').textContent = fmtBalance(bal);
}

const nameInput = $('nameInput');
nameInput.value = localStorage.getItem('lc_name') || '';

// ---- 连接与加入 ----
function tryJoin() {
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  myName = name;
  localStorage.setItem('lc_name', name);
  openSocket(name);
}

function openSocket(name) {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(protocol + '//' + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name: name, sid: sid }));
  ws.onmessage = e => {
    let d;
    try { d = JSON.parse(e.data); } catch (err) { return; }
    if (d.type === 'init') {
      $('login').style.display = 'none';
      $('app').style.display = 'flex';
      if (!joined) joined = true;
      const box = $('msgs');
      box.innerHTML = '';
      lastHm = '';
      d.history.forEach(m => {
        if (seenMsg(m.id)) return;
        if (m.k === 'sys') addSys(m.x, m.hm, false);
        else if (m.k === 'pat') addPat(m.from, m.to, m.hm, false);
        else addMsg(m, false);
      });
      box.scrollTop = box.scrollHeight;
      $('txt').focus();
      if (d.balance !== undefined) updateBalance(d.balance);
    } else if (d.type === 'balance') {
      if (d.balance !== undefined) updateBalance(d.balance);
    } else if (d.type === 'new') {
      if (seenMsg(d.msg.id)) return;
      addMsg(d.msg, true);
      scrollBottom(false);
    } else if (d.type === 'sys') {
      if (seenMsg(d.id)) return;
      addSys(d.x, d.hm, true);
      scrollBottom(false);
    } else if (d.type === 'pat') {
      if (seenMsg(d.id)) return;
      addPat(d.from, d.to, d.hm, true);
      scrollBottom(false);
    }
  };
  ws.onclose = () => {
    if (!joined) return;
    addSys('连接断开，重连中', true);
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      openSocket(myName || localStorage.getItem('lc_name') || '匿名');
    }, 1500);
  };
}

$('loginBtn').onclick = tryJoin;
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });

// ---- 渲染 ----
function ensureTime(hm, animate) {
  if (hm && hm !== lastHm) {
    lastHm = hm;
    const t = document.createElement('div');
    t.className = 'time' + (animate ? ' new' : '');
    t.textContent = hm;
    $('msgs').appendChild(t);
  }
}

function addSys(x, hm, animate) {
  ensureTime(hm, animate);
  const el = document.createElement('div');
  el.className = 'sys' + (animate ? ' new' : '');
  el.textContent = x;
  $('msgs').appendChild(el);
}

function addMsg(m, animate) {
  const isNew = !!animate;
  ensureTime(m.hm, isNew);
  const line = document.createElement('div');
  line.className = 'line' + (m.n === myName ? ' mine' : '') + (isNew ? ' new' : '');
  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = '[' + m.n + ']';
  nm.onclick = () => {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'pat', target: m.n }));
  };
  const tx = document.createElement('span');
  tx.className = 'tx';
  tx.textContent = m.x;
  line.appendChild(nm);
  line.appendChild(tx);
  $('msgs').appendChild(line);
}

// ---- 拍一拍 ----
function addPat(from, to, hm, animate) {
  const iAmFrom = from === myName;
  const iAmTo = to === myName;
  let text;
  if (iAmFrom && iAmTo) text = '你拍了拍自己';
  else if (iAmTo) text = from + '拍了拍你';
  else if (iAmFrom) text = '你拍了拍' + to;
  else text = from + '拍了拍' + to;
  addSys(text, hm, animate);
  if (iAmTo && animate) {
    const app = $('app');
    app.classList.remove('shaking');
    void app.offsetWidth;
    app.classList.add('shaking');
    if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  }
}

function nearBottom() {
  const b = $('msgs');
  return b.scrollHeight - b.scrollTop - b.clientHeight < 60;
}
$('msgs').addEventListener('scroll', () => { stick = nearBottom(); });

function scrollBottom(force) {
  const b = $('msgs');
  if (force || stick) b.scrollTop = b.scrollHeight;
}

// ---- 发送 ----
function sendMsg() {
  const v = $('txt').value.trim();
  if (!v || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'msg', text: v }));
  $('txt').value = '';
  stick = true;
  $('emoWrap').classList.remove('open');
}
$('send').onclick = sendMsg;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

// ---- 表情按钮 & 颜文字条 ----
$('emoBtn').onclick = () => {
  const open = $('emoWrap').classList.toggle('open');
  if (open) $('emo').scrollLeft = 0;
};

// ---- 转账按钮 ----
let giving = false;
$('sendBtn').onclick = () => {
  giving = !giving;
  const txt = $('txt');
  if (giving) {
    txt.placeholder = '指令格式 /give [名字] [数量] [单位] (指令不带方括号)';
    txt.focus();
  } else {
    txt.placeholder = '';
  }
};
$('txt').addEventListener('input', () => {
  if (giving) {
    giving = false;
    $('txt').placeholder = '';
  }
});

EMOS.forEach(s => {
  const b = document.createElement('button');
  b.textContent = s;
  b.onclick = () => { $('txt').value += s; $('txt').focus(); };
  $('emo').appendChild(b);
});
</script>
</body>
</html>
